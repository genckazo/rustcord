name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
  macos:
    name: macOS package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: test "$(uname -m)" = "$EXPECTED_ARCH"
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
      - run: bash scripts/bundle-macos.sh
      - run: ditto -c -k --sequesterRsrc --keepParent dist/Rustcord.app dist/Rustcord-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Rustcord-macos-${{ matrix.arch }}
          path: |
            dist/Rustcord-macos.zip
            dist/Rustcord-*-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
