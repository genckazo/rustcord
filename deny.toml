# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run locally with `cargo deny --locked check`.

[graph]
# Rustcord ships for macOS and builds on Linux; Windows/Android/wasm-only
# crates from Rune's tree are not part of any shipped binary.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
unmaintained = "all"
yanked = "deny"
ignore = [
    # songbird -> davey -> p256 -> elliptic-curve -> crypto-bigint.
    # elliptic-curve requires ^0.5; fixed crypto-bigint >=0.7.6 is incompatible.
    # Owner-approved; revisit when davey/openmls_rust_crypto/p256 release fixes.
    { id = "RUSTSEC-2026-0387", reason = "elliptic-curve requires ^0.5; fixed crypto-bigint >=0.7.6 is incompatible; owner-approved pending upstream fixes" },
    # songbird -> davey -> openmls_rust_crypto -> hpke-rs -> libcrux-sha3.
    # hpke-rs requires ^0.0.8; fixed libcrux-sha3 >=0.0.10 is incompatible.
    # Owner-approved; revisit when davey/openmls_rust_crypto/p256 release fixes.
    { id = "RUSTSEC-2026-0207", reason = "hpke-rs requires ^0.0.8; fixed libcrux-sha3 >=0.0.10 is incompatible; owner-approved pending upstream fixes" },
    # songbird -> davey -> openmls_rust_crypto -> hpke-rs -> libcrux-sha3.
    # hpke-rs requires ^0.0.8; fixed libcrux-sha3 >=0.0.10 is incompatible.
    # Owner-approved; revisit when davey/openmls_rust_crypto/p256 release fixes.
    { id = "RUSTSEC-2026-0208", reason = "hpke-rs requires ^0.0.8; fixed libcrux-sha3 >=0.0.10 is incompatible; owner-approved pending upstream fixes" },
    # songbird -> davey -> openmls_rust_crypto -> hpke-rs -> libcrux-sha3 -> libcrux-traits -> libcrux-secrets.
    # libcrux-traits pins =0.0.5; fixed libcrux-secrets >=0.0.6 is incompatible.
    # Owner-approved; revisit when davey/openmls_rust_crypto/p256 release fixes.
    { id = "RUSTSEC-2026-0212", reason = "libcrux-traits pins =0.0.5; fixed libcrux-secrets >=0.0.6 is incompatible; owner-approved pending upstream fixes" },
    # songbird -> davey -> openmls -> fluvio-wasm-timer -> parking_lot -> instant.
    # unmaintained with no fixed release; replacing the timer requires upstream changes.
    # Owner-approved; revisit when davey/openmls_rust_crypto/p256 release fixes.
    { id = "RUSTSEC-2024-0384", reason = "unmaintained with no fixed release; replacing the timer requires upstream changes; owner-approved pending upstream fixes" },
    # songbird -> davey -> openmls -> fluvio-wasm-timer -> pin-utils.
    # unmaintained with no fixed release; replacing timer macros requires upstream changes.
    # Owner-approved; revisit when davey/openmls_rust_crypto/p256 release fixes.
    { id = "RUSTSEC-2026-0441", reason = "unmaintained with no fixed release; replacing timer macros requires upstream changes; owner-approved pending upstream fixes" },
    # songbird -> davey -> openmls_rust_crypto -> hpke-rs -> optional hpke-rs-libcrux -> libcrux-aead -> libcrux-aesgcm.
    # lockfile-only optional backend; no fixed release in the locked series.
    # Owner-approved; revisit when davey/openmls_rust_crypto/p256 release fixes.
    { id = "RUSTSEC-2026-0209", reason = "lockfile-only optional backend; no fixed release in the locked series; owner-approved pending upstream fixes" },
    # songbird -> davey -> openmls_rust_crypto -> hpke-rs -> optional hpke-rs-libcrux -> libcrux-aead -> libcrux-aesgcm.
    # lockfile-only optional backend; renamed crate requires upstream migration.
    # Owner-approved; revisit when davey/openmls_rust_crypto/p256 release fixes.
    { id = "RUSTSEC-2026-0210", reason = "lockfile-only optional backend; renamed crate requires upstream migration; owner-approved pending upstream fixes" },
    # songbird -> davey -> openmls_rust_crypto -> hpke-rs -> optional hpke-rs-libcrux -> libcrux-aead -> libcrux-aesgcm.
    # lockfile-only optional backend; no fixed release in the locked series.
    # Owner-approved; revisit when davey/openmls_rust_crypto/p256 release fixes.
    { id = "RUSTSEC-2026-0211", reason = "lockfile-only optional backend; no fixed release in the locked series; owner-approved pending upstream fixes" },
    # songbird -> davey -> openmls_rust_crypto -> hpke-rs -> optional hpke-rs-libcrux -> libcrux-aead -> libcrux-chacha20poly1305.
    # lockfile-only optional backend; =0.0.7 cannot select fixed >=0.0.8.
    # Owner-approved; revisit when davey/openmls_rust_crypto/p256 release fixes.
    { id = "RUSTSEC-2026-0124", reason = "lockfile-only optional backend; ^0.0.7 cannot select fixed >=0.0.8; owner-approved pending upstream fixes" },
    # songbird -> davey -> openmls_rust_crypto -> hpke-rs -> optional hpke-rs-libcrux -> libcrux-kem.
    # lockfile-only optional backend; ^0.0.7 cannot select fixed >=0.0.10.
    # Owner-approved; revisit when davey/openmls_rust_crypto/p256 release fixes.
    { id = "RUSTSEC-2026-0330", reason = "lockfile-only optional backend; ^0.0.7 cannot select fixed >=0.0.10; owner-approved pending upstream fixes" },
    # songbird -> davey -> openmls_rust_crypto -> hpke-rs -> optional hpke-rs-libcrux -> libcrux-kem.
    # lockfile-only optional backend; ^0.0.7 cannot select fixed >=0.0.10.
    # Owner-approved; revisit when davey/openmls_rust_crypto/p256 release fixes.
    { id = "RUSTSEC-2026-0331", reason = "lockfile-only optional backend; ^0.0.7 cannot select fixed >=0.0.10; owner-approved pending upstream fixes" },
    # songbird -> davey -> openmls_rust_crypto -> hpke-rs -> libcrux-sha3 -> hax-lib -> hax-lib-macros -> proc-macro-error2.
    # unmaintained with no fixed release; retained by libcrux's upstream macros.
    # Owner-approved; revisit when davey/openmls_rust_crypto/p256 release fixes.
    { id = "RUSTSEC-2026-0173", reason = "unmaintained with no fixed release; retained by libcrux's upstream macros; owner-approved pending upstream fixes" },
    # songbird 0.6.1 -> derivative: unmaintained derive macros, no fixed release;
    # retained for the pinned driver, compile-time only.
    # Revisit when davey/openmls_rust_crypto/p256 release fixes.
    { id = "RUSTSEC-2024-0388", reason = "songbird requires derivative; compile-time macros, no fixed release" },
    # songbird -> serde-aux -> chrono: unmaintained, no fixed release.
    # Used for upstream timestamp serde, not for Rustcord's timestamp display.
    # Revisit when davey/openmls_rust_crypto/p256 release fixes.
    { id = "RUSTSEC-2026-0543", reason = "songbird serde-aux requires chrono; no fixed release, timestamp serde only" },
    # zbus 5.x helper crates, folded into zbus 6. Pulled in on Linux only, via
    # Rune's accesskit_unix (pinned git rev) and keyring's Secret Service store.
    # No upgrade is possible until both move to zbus 6. Keep in sync with
    # .cargo/audit.toml.
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained; transitive via rune/keyring, needs upstream zbus 6 migration" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained; transitive via rune/keyring, needs upstream zbus 6 migration" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained; transitive via rune/keyring, needs upstream zbus 6 migration" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# MPL-2.0 is file-level copyleft: fine to link unmodified, so it is allowed
# only for named media/voice dependencies rather than globally.
exceptions = [
    # Rustcord -> symphonia (PCM feature): file-level copyleft codec, linked
    # unmodified to decode Songbird's raw microphone input.
    { allow = ["MPL-2.0"], crate = "symphonia-codec-pcm" },
    # songbird -> davey -> openmls_rust_crypto -> hpke-rs: DAVE encryption;
    # accepted as unmodified file-level-copyleft dependencies, not a global allow.
    { allow = ["MPL-2.0"], crate = "hpke-rs" },
    # Same DAVE HPKE path, the shared crypto traits; linked unmodified.
    { allow = ["MPL-2.0"], crate = "hpke-rs-crypto" },
    # Same DAVE HPKE path, the RustCrypto backend; linked unmodified.
    { allow = ["MPL-2.0"], crate = "hpke-rs-rust-crypto" },
    { allow = ["MPL-2.0"], crate = "opuscule" },
    { allow = ["MPL-2.0"], crate = "symphonia" },
    { allow = ["MPL-2.0"], crate = "symphonia-codec-vorbis" },
    { allow = ["MPL-2.0"], crate = "symphonia-core" },
    { allow = ["MPL-2.0"], crate = "symphonia-format-mkv" },
    { allow = ["MPL-2.0"], crate = "symphonia-format-ogg" },
    { allow = ["MPL-2.0"], crate = "symphonia-metadata" },
    { allow = ["MPL-2.0"], crate = "symphonia-utils-xiph" },
]

[licenses.private]
# rustcord itself is unpublished (publish = false) and has no license field.
ignore = true

[bans]
# Duplicates come from Rune's dependency tree; report them without failing.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Rune and its vendor patches, pinned to one revision in Cargo.toml.
allow-git = ["https://github.com/anomalyco/rune"]
